<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b14" />
    <title>Dofadar Tv — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #070b14;
        color: #eef2ff;
        font-family: system-ui, sans-serif;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        max-width: 22rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 1rem;
        padding: 1.5rem;
        background: rgba(15, 22, 41, 0.92);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: #94a3b8;
        line-height: 1.5;
      }
      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.1rem;
        background: #0ea5e9;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>Reconnect to the internet, then reload Dofadar Tv to watch live channels.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
